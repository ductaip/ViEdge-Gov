# => Xem docs/DECISIONS.md ADR-008.

corpus:
  - id: "Luật 36/2024/QH15"
    path: data/raw/luat_36_2024.txt
    hieu_luc: "2025-01-01"
    note: "Luật Trật tự, an toàn giao thông đường bộ. Luật nền."

  - id: "QCVN 41:2024/BGTVT"
    path: data/raw/qcvn_41_2024.txt
    hieu_luc: "2025-01-01"
    note: |
      Quy chuẩn quốc gia về báo hiệu đường bộ, kèm Thông tư 51/2024/TT-BGTVT,
      thay thế QCVN 41:2019. Đã xác minh CÒN HIỆU LỰC năm 2026.
      Nguồn mã hiệu biển báo (P./B./W./R./I./S.) cho detector và cho câu hỏi
      loại y_nghia_bien_bao.

  - id: "Nghị định 168/2024/NĐ-CP"
    path: data/raw/nd_168_2024.txt
    hieu_luc: "2025-01-01"
    note: |
      Xử phạt VPHC về trật tự, an toàn giao thông trong lĩnh vực giao thông đường bộ.
      Đây là văn bản LỚN NHẤT và quan trọng nhất của kho — mọi câu hỏi mức phạt
      đều truy về đây. Dùng BẢN GỐC; phần sửa đổi của NĐ 238/2026 nạp riêng qua
      lớp phủ (mục `amendments:` bên dưới), KHÔNG ghép vào văn bản này.
      Nguồn: xaydungchinhsach.chinhphu.vn (HTML toàn văn, sạch).

  - id: "Nghị định 336/2025/NĐ-CP"
    path: data/raw/nd_336_2025.txt
    hieu_luc: "2026-03-01"
    note: |
      Xử phạt VPHC trong HOẠT ĐỘNG đường bộ — phạm vi KHÁC 168/2024 (hạ tầng,
      kinh doanh vận tải, thanh toán điện tử giao thông). Đã bãi bỏ một số điều
      của NĐ 100/2019, 123/2021 và 168/2024.
      ⚠️ TUYỆT ĐỐI KHÔNG đưa NĐ 100/2019 vào corpus — đã bị bãi bỏ phần lớn;
      mô hình trích dẫn nó là ca lỗi E3 kinh điển.

  - id: "TTHC giao thông"
    path: data/raw/tthc_giao_thong.txt
    format: tthc
    hieu_luc: "2026-07-30"
    note: |
      Thủ tục đăng ký xe (cấp mới, sang tên, thu hồi, cấp đổi, đăng ký tạm thời).
      Nguồn: dichvucong.gov.vn / dichvucong.bocongan.gov.vn, mỗi thủ tục có mã
      (vd. 1.010910). KHÔNG có GPLX — đã loại vì Thông tư 12/2025/TT-BCA vừa bị
      thay thế cuối 07/2026, đang biến động (xem DATA_SOURCES.md mục 2b).
      Không có 'Điều N' -> parse bằng CO.parse_tthc(), KHÔNG dùng parse_document().

# Văn bản SỬA ĐỔI — nạp riêng, nối vào điều bị sửa qua viedge.data.amendments.
# Không ghép văn bản: NĐ 238 có 17 thao tác mức cụm từ ở Điều 19, tự động áp
# dụng là một đề tài riêng và sai một thao tác thì mức phạt sai âm thầm.
amendments:
  - id: "Nghị định 238/2026/NĐ-CP"
    path: data/raw/nd_238_2026.txt
    amends: "Nghị định 168/2024/NĐ-CP"
    hieu_luc: "2026-08-15"
    note: |
      Sửa đổi 21 điều của NĐ 168. Hiệu lực 15/08/2026 — TRONG kỳ làm đề tài.
      Lớp phủ bật/tắt theo `as_of`, dùng làm nhánh đối chứng độ trễ pháp lý (ADR-008).

# BẮT BUỘC điền khi chốt. Hội đồng SẼ hỏi "luật đổi thì sao".
corpus_snapshot_date: "2026-08-15"
corpus_snapshot_note: "Tải từ xaydungchinhsach.chinhphu.vn (Luật/NĐ), vbpl.vn (QCVN 41 PDF), dichvucong.gov.vn + dichvucong.bocongan.gov.vn (TTHC). Hợp nhất đến NĐ 238/2026 hiệu lực 15/08/2026."

# Bộ đối chứng đo độ trễ pháp lý (ADR-008). enabled=false nếu bỏ thí nghiệm này.
corpus_stale_variant:
  enabled: false
  path_prefix: data/raw/stale_pre_20260815/
  note: "Bản corpus TRƯỚC 15/08/2026 (chưa gộp NĐ 238) — nhánh đối chứng."

retriever:
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    enabled: true
    model: "AITeamVN/Vietnamese_Embedding"
    fallback: "intfloat/multilingual-e5-base"
    batch_size: 32
  fusion:
    method: rrf
    rrf_k: 60
    bm25_weight: 1.0
    dense_weight: 1.0
    pool: 30
  dynamic_top_k:
    min_k: 1
    max_k: 10
    drop_ratio: 0.55

generation:
  backend: llama_cpp          # llama_cpp (CPU, offline) | vllm (GPU, đối chứng)
  n_ctx: 8192
  temperature: 0.0            # nhiệt độ 0 để kết quả tái lập được
  max_tokens: 512
  n_threads: null

safety:
  require_citation: true
  block_on_bad_citation: true
  disclaimer_always: true
  disclaimer_include_snapshot_date: true
