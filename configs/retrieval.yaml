      Một số trang trên cổng còn văn bản cũ ghi "Sở Giao thông vận tải" —
      kiểm tay từng thủ tục, đừng crawl mù.

# BẮT BUỘC điền khi chốt. Hội đồng SẼ hỏi "luật đổi thì sao".
corpus_snapshot_date: "2026-08-__"
corpus_snapshot_note: |
  Ghi rõ: bản nào, hợp nhất đến văn bản sửa đổi nào, tải ngày nào, từ nguồn nào.

# Bộ đối chứng đo độ trễ pháp lý (ADR-008). enabled=false nếu bỏ thí nghiệm này.
corpus_stale_variant:
  enabled: false
  path_prefix: data/raw/stale_pre_20260815/
  note: "Bản corpus TRƯỚC 15/08/2026 (chưa gộp NĐ 238) — nhánh đối chứng."

retriever:
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    enabled: true
    model: "AITeamVN/Vietnamese_Embedding"
    fallback: "intfloat/multilingual-e5-base"
    batch_size: 32
  fusion:
    method: rrf
    rrf_k: 60
    bm25_weight: 1.0
    dense_weight: 1.0
    pool: 30
  dynamic_top_k:
    min_k: 1
    max_k: 10
    drop_ratio: 0.55

generation:
  backend: llama_cpp          # llama_cpp (CPU, offline) | vllm (GPU, đối chứng)
  n_ctx: 8192
  temperature: 0.0            # nhiệt độ 0 để kết quả tái lập được
  max_tokens: 512
  n_threads: null

safety:
  require_citation: true
  block_on_bad_citation: true
  disclaimer_always: true
  disclaimer_include_snapshot_date: true