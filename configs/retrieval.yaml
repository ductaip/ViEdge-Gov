# Nghị định 238/2026/NĐ-CP (ban hành 26/06/2026) sửa đổi Nghị định 168/2024/NĐ-CP
# và **có hiệu lực từ 15/08/2026** — tức 10 ngày TRƯỚC hạn nộp Euréka (25/08),
